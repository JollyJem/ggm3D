{% extends "base.html" %}
{% block title %}Catalog — GGM 3D Configurator{% endblock %}
{% block content %}
<div class="flex items-start justify-between gap-3 mb-4">
  <h1 class="text-2xl font-bold">Products</h1>
  <!-- static QR from scripts/make_qr.py; desktop only, on a phone you are already here -->
  <div class="hidden sm:flex items-center gap-2 shrink-0">
    <span class="text-xs text-gray-500 text-right w-20 leading-tight">Scan to open on your phone</span>
    <img src="/static/img/qr.png" alt="QR code for ggm3d.onrender.com"
         class="w-16 h-16 rounded border border-gray-200 bg-white">
  </div>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
  {% for p in products %}
  <a href="/products/{{ p.id }}"
     class="block bg-white rounded-xl shadow-sm hover:shadow-md transition p-4 min-h-[44px]">
    <div class="aspect-[4/3] bg-gray-100 rounded-lg mb-3 overflow-hidden flex items-center justify-center">
      <img src="{{ p.image_url }}" alt="{{ p.name }}"
           class="object-contain w-full h-full"
           onerror="this.style.display='none'; this.parentElement.textContent='📦';">
    </div>
    <h2 class="font-semibold">{{ p.name }}</h2>
    <p class="text-sm text-gray-500 mt-1">
      {{ p.width_mm }} × {{ p.depth_mm }} × {{ p.height_mm }} mm
    </p>
  </a>
  {% endfor %}
</div>
{% endblock %}
