<model-viewer
  id="product-viewer"
  src="{{ glb_url }}"
  {% if usdz_url %}ios-src="{{ usdz_url }}"{% endif %}
  alt="3D model of {{ product.name }}"
  ar
  ar-modes="scene-viewer webxr quick-look"
  ar-scale="fixed"
  camera-controls
  auto-rotate
  {# the viewer sits at the top of the page so lazy is close to eager here, but
     it is the honest declaration: nothing downloads until the element matters.

     Deliberately NOT reveal="interaction". This partial is what HTMX swaps in
     the moment Generate finishes, and a poster waiting for a tap at exactly
     that moment reads as "the build failed" — the one misreading a live demo
     cannot afford. The visibilitychange pause below is what actually addresses
     the AR handoff; deferring the load only hid it. #}
  loading="lazy"
  poster="{{ product.image_url }}"
  {# fully metallic steel renders black without something to reflect: the studio
     HDRI is what puts softbox highlights on the panels and edge chamfers.

     Do NOT add a ?v= cache-buster here. model-viewer picks the Radiance loader
     with /\.hdr(\.js)?$/ against the whole URL, so "studio.hdr?v=1" misses and
     the file is handed to the image loader instead. It fails silently: no
     environment, and the steel goes black. The file gets max-age=3600 rather
     than immutable, which is the cheaper side of that trade. #}
  environment-image="/static/hdr/studio.hdr"
  tone-mapping="neutral"
  exposure="1.0"
  shadow-intensity="1"
  shadow-softness="0.8"
  {# the animated finger hint keeps the render loop awake for no benefit on a
     touch screen, where dragging the model is the obvious thing to try #}
  interaction-prompt="none">
  <button slot="ar-button"
          class="absolute bottom-3 right-3 bg-orange-500 text-white font-semibold rounded-full px-5 py-3 min-h-[44px] shadow">
    View in your room
  </button>
</model-viewer>
<script>
  /* auto-rotate never stops on its own: it renders frames for as long as the
     page is open, which on a phone means the GPU stays busy and the battery
     drains while the model just spins. Let it turn once so the interviewer sees
     every side, then park it. model-viewer stops drawing once nothing moves, so
     the idle cost after this is zero until the user drags. */
  (function () {
    var viewer = document.getElementById('product-viewer');
    if (!viewer) return;

    var ROTATION_MS = 15000; // 3 s start delay + one 12 s turn at the default speed

    function park() {
      viewer.removeAttribute('auto-rotate');
      viewer.removeEventListener('camera-change', onCameraChange);
    }

    function onCameraChange(event) {
      // the moment the user takes the camera, they are driving, not the demo
      if (event.detail && event.detail.source === 'user-interaction') park();
    }

    /* Phones never get the spin. The demo phone is the one device where a
       permanently busy GPU costs something — it is also the one that has to
       hand a working GPU over to Scene Viewer a few seconds later — and on a
       390 px screen a thumb is already on the model. Desktop keeps the turn,
       where it reads as polish and the GPU is idle anyway. */
    if (window.matchMedia('(max-width: 640px)').matches) {
      park();
    } else {
      viewer.addEventListener('camera-change', onCameraChange);
      // time the turn from when the model is actually on screen, not from parse
      viewer.addEventListener('load', function () {
        setTimeout(park, ROTATION_MS);
      }, { once: true });
    }

    /* Tapping "View in your room" backgrounds this tab and starts ARCore.
       model-viewer 3.5 does not watch document visibility — only its
       interaction prompt does, and that is off — so without this the WebGL
       loop is still drawing an HDRI-lit metal scene while Scene Viewer brings
       up the camera and its own renderer. Park the rotation before handing the
       GPU over; there is nothing to see behind Scene Viewer anyway.

       Registered once per page and resolved by id when it fires. This partial
       is what HTMX swaps in after every Generate, so a listener closing over
       the element it was created with would pin that model-viewer on `document`
       after HTMX detached it — and a detached model-viewer keeps its WebGL
       context. Phones allow a handful of live contexts; spend them on repeated
       builds and the next one is refused, which is a black viewer or a failed
       AR handoff on the device least able to spare the memory. */
    if (!window.__ggmParkOnHide) {
      window.__ggmParkOnHide = true;
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState !== 'hidden') return;
        var current = document.getElementById('product-viewer');
        if (current) current.removeAttribute('auto-rotate');
      });
    }
  })();
</script>
{% if is_sample %}
<p class="text-sm text-gray-400 mt-2">Sample model — tap Generate to build this product at its real dimensions.</p>
{% endif %}
